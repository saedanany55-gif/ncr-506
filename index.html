<style>
:root{--bg:#f2f4f6;--card:#fff;--ink:#16202a;--muted:#5d6b78;--line:#e3e8ec;--accent:#0f6b5c;--accent-soft:#e3f2ef;--bad:#c0281b;--bad-soft:#fdecea;--warn:#9a6700;--warn-soft:#fff4d6;--pen:#7a3db8;--bar:#0f6b5c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1215;--card:#172026;--ink:#e8eef2;--muted:#97a6b2;--line:#273139;--accent:#4cc3a8;--accent-soft:#132c26;--bad:#ff8a7a;--bad-soft:#36191a;--warn:#f2c14e;--warn-soft:#30270f;--pen:#c49bf5;--bar:#11463d}}
:root[data-theme="dark"]{--bg:#0d1215;--card:#172026;--ink:#e8eef2;--muted:#97a6b2;--line:#273139;--accent:#4cc3a8;--accent-soft:#132c26;--bad:#ff8a7a;--bad-soft:#36191a;--warn:#f2c14e;--warn-soft:#30270f;--pen:#c49bf5;--bar:#11463d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;font-size:15px;line-height:1.4;padding-bottom:calc(132px + env(safe-area-inset-bottom))}
.wrap{max-width:640px;margin:0 auto;padding:14px 12px 8px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
h1{font-size:18px;margin:0}
.period{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.toast{margin:0 0 10px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.hint{color:var(--muted);font-size:12px;margin:0 2px 8px}

/* قائمة المؤشرات: صف قصير لكل مؤشر */
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pi{border-top:1px solid var(--line)}
.pi:first-child{border-top:0}
.row{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 8px;min-height:60px}
.code{flex:none;width:46px;height:30px;border-radius:8px;background:var(--bg);color:var(--ink);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.pi.hit .code{background:var(--bad);color:#fff}
.pi.near .code{background:var(--warn-soft);color:var(--warn)}
.name{flex:1;min-width:0;border:0;background:none;color:inherit;text-align:right;padding:4px 0;cursor:pointer;font:inherit}
.name b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi.hit .name span{white-space:normal}
.st i{display:block;font-style:normal;font-weight:600}
.st .dd{color:var(--bad)}.st .ss{color:var(--ink)}.st .pp{color:var(--pen)}.st .pp0{color:var(--muted);font-weight:400}
.step{flex:none;display:flex;align-items:center;direction:ltr;gap:4px}
.step button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:22px;line-height:1;cursor:pointer;touch-action:manipulation}
.step button:active{background:var(--accent-soft)}
.step input{width:52px;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:19px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums;-moz-appearance:textfield;padding:0}
.step input::-webkit-inner-spin-button,.step input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
/* تفاصيل المؤشر عند الضغط على اسمه */
.det{display:none;padding:0 12px 12px 12px;font-size:13px}
.pi.open .det{display:block}
.box{background:var(--bg);border-radius:10px;padding:8px 10px}
.line{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.line .v{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.line.ded .v{color:var(--bad)}.line.pen .v{color:var(--pen)}
.line.sum{border-top:1px solid var(--line);margin-top:4px;padding-top:6px;font-size:14px}
.why{color:var(--muted);font-size:12px;margin-top:6px}
.opt{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--muted)}
.opt select{flex:1;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:14px;padding:0 8px}
.opt input{width:72px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);text-align:center;font-size:16px}

/* أدوات */
.tools{display:grid;grid-template-columns:1fr auto;gap:8px;margin:12px 0}
.btn{min-height:48px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 12px;border-radius:12px;font-size:15px;cursor:pointer}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent;font-weight:600}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
summary{padding:14px;font-weight:600;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"▾";float:left;color:var(--muted)}
details[open] summary::after{content:"▴"}
.body{padding:0 14px 14px;font-size:13px}
.f{background:var(--bg);border-radius:10px;padding:10px 12px;margin:8px 0;line-height:1.8}
.f code{font-family:inherit;font-weight:700;color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
th,td{padding:6px 3px;border-bottom:1px solid var(--line);text-align:center}
th{color:var(--muted);font-weight:600}
td:first-child,th:first-child{text-align:right}
.hrow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}
.hrow small{display:block;color:var(--muted);font-size:11px}
.hrow .v{text-align:left;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.note{color:var(--muted);font-size:12px;line-height:1.8;margin:4px 2px}

/* شريط الإجمالي أسفل الشاشة (منطقة الإبهام) */
.bar{position:fixed;inset:auto 0 0 0;z-index:10;background:var(--bar);color:#fff;padding:10px 14px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(0,0,0,.18)}
.bar .in{max-width:640px;margin:0 auto}
.bar .t1{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.bar .lbl{font-size:12px;opacity:.9}
.bar .amt{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.bar .split{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:6px}
.bar .split div{background:rgba(255,255,255,.14);border-radius:9px;padding:4px 8px}
.bar .split b{display:block;font-size:14px;font-variant-numeric:tabular-nums}
.bar .split span{font-size:11px;opacity:.9}
.bar .meta{font-size:11px;opacity:.85;margin-top:4px}
</style>

const RATES = [0, 0, 0.05, 0.10, 0.15, 0.20];
const RNAME = ["", "الشهر الأول", "الشهر الثاني", "الشهر الثالث", "الشهر الرابع", "الشهر الخامس"];
const MONTHS = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const KEY = "ncr_calc_506_v4";
const fmt = n => Math.round(n).toLocaleString("en-US");
const fmt2 = n => n.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const pct = n => (n * 100).toFixed(3) + "%";

function periodOf(d) { let y = d.getFullYear(), m = d.getMonth(); if (d.getDate() < 20) { m--; if (m < 0) { m = 11; y--; } } return {y, m}; }
function nextPeriod(p) { return p.m === 11 ? {y: p.y + 1, m: 0} : {y: p.y, m: p.m + 1}; }
function samePeriod(a, b) { return a && b && a.y === b.y && a.m === b.m; }
function periodShort(p) { const e = nextPeriod(p); return `${MONTHS[e.m]} ${e.y}`; }
function periodLabel(p) { const e = nextPeriod(p); return `${MONTHS[e.m]} ${e.y} — من ⁦20/${p.m + 1}/${p.y}⁩ إلى ⁦19/${e.m + 1}/${e.y}⁩`; }
function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); return true; } catch (e) { return false; } }
let S = load();
const fresh = !S.period;
if (!S.period) S.period = periodOf(new Date());
if (!Array.isArray(S.history)) S.history = [];
S.over = S.over || {}; S.fixed = S.fixed || {};
// أرقام الواجهة: كلما تحدّثت الواجهة (cur_at جديد) تُحمَّل أعدادها لنفس الشهر
if (samePeriod(S.period, D.cur_period) && S.cur_key !== D.cur_key) {
  S.draft = Object.fromEntries(Object.entries(D.cur).map(([c, n]) => [c, String(n)]));
  S.over = {}; S.cur_key = D.cur_key;
}
S.draft = S.draft || {};

function prevRepeat(code) {
  if (S.history.length) return (S.history[S.history.length - 1].rep || {})[code] || 0;
  return D.base[code] || 0;
}
const amountFor = (p, n) => p.a[Math.min(n, p.a.length - 1)];

const list = document.getElementById("list"), items = [];
D.pis.forEach((p, idx) => {
  const el = document.createElement("div"); el.className = "pi";
  el.innerHTML = `
    <div class="row">
      <span class="code">${p.code}</span>
      <div class="name"><b>${p.name}</b><span class="st"></span></div>
      <div class="step">
        <button type="button" data-d="-1" aria-label="إنقاص ${p.code}">−</button>
        <input type="number" min="0" step="1" inputmode="numeric" pattern="[0-9]*" enterkeyhint="${idx < D.pis.length - 1 ? "next" : "done"}" placeholder="0" aria-label="عدد NCR للمؤشر ${p.code}">
        <button type="button" data-d="1" aria-label="زيادة ${p.code}">+</button>
      </div>
    </div>
`;
  list.appendChild(el);
  const it = {p, el, inp: el.querySelector(".step input"), fx: null};
  items.push(it);
  if (S.draft[p.code] !== undefined) it.inp.value = S.draft[p.code];
  if (it.fx && S.fixed[p.code]) it.fx.value = S.fixed[p.code];
  el.querySelectorAll(".step button").forEach(b => b.onclick = () => {
    it.inp.value = Math.max(0, (Number(it.inp.value) || 0) + Number(b.dataset.d)); calc();
  });
  it.inp.addEventListener("input", calc);
  it.inp.addEventListener("focus", () => it.inp.select());
  it.inp.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); const nx = items[idx + 1]; if (nx) nx.inp.focus(); else it.inp.blur(); }
  });
});

function rowResult(it) {
  const {p} = it;
  const filled = it.inp.value !== "";
  const n = Math.max(0, Math.floor(Number(it.inp.value) || 0));
  const ded = filled ? amountFor(p, n) : 0;
  const fails = ded > 0;
  const autoRep = fails ? Math.min(5, prevRepeat(p.code) + 1) : 0;
  const rep = fails ? (S.over[p.code] ?? autoRep) : 0;
  const pen = RATES[rep] * p.weight * D.lump;
  const cases = it.fx ? Math.max(0, Math.floor(Number(it.fx.value) || 0)) : 0;
  const fix = cases * (p.fixed || 0);
  return {n, filled, ded, fails, autoRep, rep, pen, fix, cases, score: Math.max(0, 1 - n * p.rate)};
}

function calc() {
  let tDed = 0, tPen = 0, tFix = 0, ncr = 0, hit = 0;
  S.draft = {}; S.fixed = {};
  for (const it of items) {
    const {p, el} = it, r = rowResult(it);
    S.draft[p.code] = it.inp.value; if (r.cases) S.fixed[p.code] = r.cases;
    tDed += r.ded; tPen += r.pen; tFix += r.fix; ncr += r.n; if (r.fails) hit++;
    const left = p.allowed - r.n, sum = r.ded + r.pen + r.fix;
    el.classList.toggle("hit", sum > 0);
    el.classList.toggle("near", sum === 0 && r.filled && left <= 2);
    const st = el.querySelector(".st");
    if (sum > 0) {
      st.innerHTML = `<i class="dd">خصم NCR: ${fmt2(r.ded)} ر.س</i>` +
        (r.pen ? `<i class="pp">غرامة التكرار (${RNAME[r.rep]} ${(RATES[r.rep] * 100).toFixed(0)}%): ${fmt2(r.pen)} ر.س</i>` +
                 `<i class="ss">الإجمالي: ${fmt2(sum)} ر.س</i>`
               : r.fails ? `<i class="pp0">غرامة التكرار: 0 (${RNAME[r.rep]})</i>` : "");
    } else {
      st.textContent = !r.filled ? `المسموح ${p.allowed}` : left === 0 ? "الملاحظة التالية تبدأ الخصم" : `متبقٍّ ${left} قبل الخصم`;
    }
  }
  const total = tDed + tPen + tFix;
  document.getElementById("tot").textContent = fmt2(total) + " ر.س";
  document.getElementById("tDed").textContent = fmt(tDed);
  document.getElementById("tPen").textContent = fmt(tPen);
  document.getElementById("totmeta").textContent = `${pct(total / D.lump)} من المقطوع · ${ncr} NCR · ${hit} مؤشر عليه خصم`;
  save();
}

function renderPeriod() { const el = document.getElementById("period"); el.textContent = periodShort(S.period); el.title = periodLabel(S.period); }
function renderHistory() {
  const box = document.getElementById("hist"); document.getElementById("histbox").hidden = !S.history.length; box.innerHTML = "";
  for (const h of [...S.history].reverse()) {
    const fails = Object.keys(h.rep || {}).map(c => `PI ${c} (${RNAME[h.rep[c]]})`).join("، ");
    const r = document.createElement("div"); r.className = "hrow";
    r.innerHTML = `<div><b>${periodLabel(h.period)}</b><small>${h.ncr} NCR · ${fails ? "فشل: " + fails : "بلا خصم"}</small></div>
      <div class="v">${fmt2(h.total)} ر.س<small>خصم ${fmt(h.ded)} · غرامات ${fmt(h.pen + h.fix)}</small></div>`;
    box.appendChild(r);
  }
}
function toast(m) { const t = document.getElementById("toast"); t.textContent = m; t.hidden = false; window.scrollTo({top: 0, behavior: "smooth"}); setTimeout(() => t.hidden = true, 6000); }

// 10/11: بدل التصفير — الرجوع للأرقام الحالية (الحسبة الحية) بعد أي تعديل يدوي
// 10/11: بلا نافذة تأكيد (متصفح واتساب الداخلي يخفيها فلا يعمل الزر)، ويرجع دائماً لشهر الواجهة الحالي —
// إن ثُبّت الشهر الحالي بالخطأ يُلغى ذلك التثبيت ويعود الشهر نفسه بأرقامه الحية.
const periodNum = p => p.y * 12 + p.m;
document.getElementById("reset").onclick = () => {
  const cur = D.cur_period;
  if (cur && periodNum(S.period) !== periodNum(cur)) {
    S.history = S.history.filter(h => periodNum(h.period) < periodNum(cur));
    S.period = {y: cur.y, m: cur.m};
    renderPeriod(); renderHistory();
  }
  items.forEach(it => { const n = D.cur[it.p.code]; it.inp.value = n ? String(n) : ""; if (it.fx) it.fx.value = ""; });
  S.over = {}; S.cur_key = D.cur_key; calc();
  toast("تمت العودة إلى الأرقام الحالية.");
};
document.getElementById("lock").onclick = () => {
  const counts = {}, rep = {}; let ded = 0, pen = 0, fix = 0, ncr = 0;
  for (const it of items) { const r = rowResult(it); counts[it.p.code] = r.n; ded += r.ded; pen += r.pen; fix += r.fix; ncr += r.n; if (r.fails) rep[it.p.code] = r.rep; }
  const total = ded + pen + fix, label = periodLabel(S.period);
  if (!confirm(`تثبيت ${label}؟\n${ncr} NCR — الإجمالي ${fmt2(total)} ر.س\n(خصم ${fmt2(ded)} + غرامات ${fmt2(pen + fix)})\nبعدها تُصفَّر الخانات ويبدأ الشهر التالي.`)) return;
  S.history.push({period: S.period, counts, rep, ded, pen, fix, total: Math.round(total * 100) / 100, ncr, locked_at: new Date().toISOString()});
  S.period = nextPeriod(S.period); S.over = {};
  items.forEach(it => { it.inp.value = ""; if (it.fx) it.fx.value = ""; });
  calc(); renderPeriod(); renderHistory();
  toast(save() ? `تم تثبيت ${label}. ابدأ إدخال ${periodLabel(S.period)}.` : "تم التثبيت لهذه الجلسة فقط — المتصفح لا يسمح بالحفظ.");
};


renderPeriod(); renderHistory(); calc();
</script>
